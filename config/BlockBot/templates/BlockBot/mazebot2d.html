<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mazebot2D</title>
    <link rel="icon" id="site-favicon" type="image/png" href="/static/frontend/icons/icon1.png" />
    <script>
      const icons = [
        "/static/frontend/icons/icon1.png",
        "/static/frontend/icons/icon2.png",
        "/static/frontend/icons/icon3.png"
      ];
      const randomIcon = icons[Math.floor(Math.random() * icons.length)];
      document.getElementById("site-favicon").href = randomIcon;
    </script>
</head>
<body>
    <h1>Mazebot2D</h1>
    <p>blocks_test: {{ blocks_test }}</p>
    <pre>{{ ascii_grid }}</pre>
    <form method="post">
        {% csrf_token %}
        <button type="submit" name="command" value="up">Up</button>
        <button type="submit" name="command" value="down">Down</button>
        <button type="submit" name="command" value="left">Left</button>
        <button type="submit" name="command" value="right">Right</button>
        <button type="submit" name="command" value="reset">Reset</button>
    </form>
</body>
</html>
