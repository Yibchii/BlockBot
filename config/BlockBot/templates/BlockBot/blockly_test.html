{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockly Test</title>
    <script src="{% static 'blockly/blockly_compressed.js' %}"></script>
    <script src="{% static 'blockly/blocks_compressed.js' %}"></script>
    <script src="{% static 'blockly/javascript_compressed.js' %}"></script>
    <script src="{% static 'blockly/msg/en.js' %}"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        #blocklyDiv {
            height: 70vh;
            width: 100%;
        }

        #output {
            min-height: 4rem;
            margin: 1rem;
            padding: 0.75rem;
            background: #f4f4f4;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Blockly Test</h1>
    <div id="blocklyDiv"></div>
    <button id="generateButton" type="button">Generate JavaScript</button>
    <pre id="output"></pre>

    <xml id="toolbox" style="display: none">
        <category name="Logic" categorystyle="logic_category">
            <block type="controls_if"></block>
            <block type="logic_compare"></block>
            <block type="logic_boolean"></block>
        </category>
        <category name="Loops" categorystyle="loop_category">
            <block type="controls_repeat_ext"></block>
            <block type="controls_whileUntil"></block>
        </category>
        <category name="Math" categorystyle="math_category">
            <block type="math_number"></block>
            <block type="math_arithmetic"></block>
        </category>
        <category name="Text" categorystyle="text_category">
            <block type="text"></block>
            <block type="text_print"></block>
        </category>
    </xml>

    <script>
        const workspace = Blockly.inject('blocklyDiv', {
            toolbox: document.getElementById('toolbox'),
        });

        document.getElementById('generateButton').addEventListener('click', () => {
            const code = javascript.javascriptGenerator.workspaceToCode(workspace);
            document.getElementById('output').textContent = code || 'No blocks in the workspace.';
        });
    </script>
</body>
</html>
